name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @safelagoon/ui build
      - run: pnpm --filter @safelagoon/ui typecheck
      - run: pnpm --filter @safelagoon/ui test

      - run: pnpm --filter @safelagoon/docs build
      - run: pnpm registry:validate
      - run: pnpm registry:build

      - name: Install Playwright browsers
        run: pnpm --filter @safelagoon/docs exec playwright install chromium

      - run: pnpm --filter @safelagoon/docs test

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}

      - name: Version, publish, and create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          should_push=false
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$pending" -gt 0 ]; then
            pnpm exec changeset version
            git add -A
            if ! git diff --staged --quiet; then
              git commit -m "chore: version packages"
              should_push=true
            fi
          fi

          if [ "$should_push" = true ]; then
            git push origin HEAD:main
          fi

          publish_output=$(pnpm exec changeset publish 2>&1 | tee /dev/stderr)
          publish_status=${PIPESTATUS[0]}
          if [ "$publish_status" -ne 0 ]; then
            exit "$publish_status"
          fi

          if echo "$publish_output" | grep -q '@safelagoon/ui@'; then
            version=$(node -p "require('./packages/ui/package.json').version")
            tag="v${version}"

            notes=$(awk -v ver="$version" '
              /^## / {
                if (found) exit
                if ($2 == ver) { found=1; next }
              }
              found { print }
            ' packages/ui/CHANGELOG.md)

            notes=$(printf '%s' "$notes" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
            if [ -z "$notes" ]; then
              notes="Release [@safelagoon/ui@${version}](https://www.npmjs.com/package/@safelagoon/ui/v/${version})."
            else
              notes="${notes}"$'\n\n'"**npm:** https://www.npmjs.com/package/@safelagoon/ui/v/${version}"
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "@safelagoon/ui ${version}" --notes "$notes"
            else
              gh release create "$tag" --title "@safelagoon/ui ${version}" --notes "$notes"
            fi
          fi

  deploy-docs:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DOCS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          target="${{ secrets.DOCS_HOST }}"
          if [[ "$target" != *@* ]]; then
            target="ubuntu@${target}"
          fi

          host="${target#*@}"
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH_TARGET=$target" >> "$GITHUB_ENV"

      - name: Rebuild and restart docs container
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_TARGET" 'bash -s' <<'EOF'
          set -euo pipefail
          REPO_DIR="${REPO_DIR:-$HOME/ui}"
          REPO_URL="${REPO_URL:-https://github.com/Safe-Lagoon/ui.git}"
          BRANCH="${BRANCH:-main}"

          if [ ! -d "$REPO_DIR/.git" ]; then
            git clone --branch "$BRANCH" "$REPO_URL" "$REPO_DIR"
          fi

          cd "$REPO_DIR"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH" "origin/$BRANCH"
          git reset --hard "origin/$BRANCH"

          bash deploy/docs-server/deploy.sh
          EOF
